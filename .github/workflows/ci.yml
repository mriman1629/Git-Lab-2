name: Node.js CI Pipeline

on:
  push:
    branches: [main, lab6-ci-pipeline]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: Lab6-CI/package-lock.json

      - name: Install dependencies
        working-directory: Lab6-CI
        run: npm ci

      - name: Lint application
        working-directory: Lab6-CI
        run: npm run lint

      - name: Run tests
        working-directory: Lab6-CI
        run: npm test

      - name: Package application
        working-directory: Lab6-CI
        run: npm run build

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: node-package-${{ matrix.node-version }}
          path: Lab6-CI/*.tgz